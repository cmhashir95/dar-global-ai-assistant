# Spins up all three services together for local/demo use.
# Run: docker compose up --build
# Then visit:
#   Website + chat:        http://localhost:4173
#   Consultant dashboard:  http://localhost:4174
#   API docs:               http://localhost:8000/docs
#
# Note: Vite bakes VITE_API_BASE_URL into the static build at BUILD time
# (not container start time), so it's passed as a build arg here, not a
# runtime environment variable. If you deploy the frontend somewhere with a
# different backend URL, rebuild the image with that build arg set.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - backend_data:/app/chroma_store

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "4173:4173"
    depends_on:
      - backend

  consultant-dashboard:
    build:
      context: ./consultant-dashboard
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "4174:4174"
    depends_on:
      - backend

volumes:
  backend_data:
